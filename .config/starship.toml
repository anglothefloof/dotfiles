format = '''
\[$username@$hostname:$directory\] $time $git_branch$git_commit$git_state$git_metrics$git_status
$character
'''

[character]
disabled = false
format = '$symbol '
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_replace_one_symbol = '[❮](bold purple)'
vimcmd_replace_symbol = '[❮](bold purple)'
vimcmd_visual_symbol = '[❮](bold yellow)'

[username]
disabled = false
style_user = 'purple'
style_root = 'red'
format = '[$user]($style)'
show_always = true

[hostname]
disabled = false
ssh_only = false
style = 'blue'
format = '[$hostname]($style)'

[directory]
disabled = false
truncation_symbol = '.../'
truncate_to_repo = true
style = 'yellow'
format = '[$path]($style)[$read_only]($read_only_style)'

[time]
disabled = false
time_format = '%m/%d %H:%M:%S'
style = 'cyan'
format = '[$time]($style)'

[git_branch]
disabled = false

[git_commit]
disabled = false

[git_state]
disabled = false

[git_metrics]
disabled = false

[git_status]
disabled = false
