unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.tmux.conf

set -g extended-keys on
set-option -g default-shell /usr/bin/fish
set-option -g terminal-features "alacritty:extkeys"
set-option -g focus-events "on"

set -g mouse on
setw -g mode-keys vi
set -sg escape-time 10

bind-key -n M-"\\" split-window -h -c "#{pane_current_path}"
bind-key -n M-"|" split-window -fh -c "#{pane_current_path}"
bind-key -n M-"-" split-window -v -c "#{pane_current_path}"
bind-key -n M-"_" split-window -fv -c "#{pane_current_path}"

unbind '"'
unbind '%'

bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

bind -n C-S-Up new-window
bind -n C-S-Left select-window -t -1
bind -n C-S-Right select-window -t +1
bind -n C-S-Down kill-window

bind -n C-q kill-pane

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind-key -T copy-mode Space send-keys -X begin-selection

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g clock-mode-colour '#fF8B87'
setw -g mode-style 'fg=#fCBBB8 bg=#850400 bold'
set -g pane-border-style 'fg=#fF8B87'
set -g pane-active-border-style 'fg=#850400'
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#fF8B87'
set -g status-left ''
set -g status-left-length 10
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
setw -g window-status-current-style 'fg=#fCBBB8 bg=#850400 bold'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=#fCBBB8 dim'
setw -g window-status-format ' #I #[fg=#fCBBB8]#W #[fg=#fCBBB8]#F '
setw -g window-status-bell-style 'fg=colour2 bg=#fF8B87 bold'
set -g message-style 'fg=#fF8B87 bg=color0 bold'

set -s set-clipboard on
bind -Tcopy-mode C-w                  send -X copy-pipe-and-cancel 'xclip -sel clip'
bind -Tcopy-mode M-w                  send -X copy-pipe-and-cancel 'xclip -sel clip'
bind -Tcopy-mode MouseDragEnd1Pane    send -X copy-pipe-and-cancel 'xclip -sel clip'
bind -Tcopy-mode-vi Enter             send -X copy-pipe-and-cancel 'xclip -sel clip'
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -sel clip'
